<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Want to Return Quest</title>
  <script>
    (() => {
      const query = location.search || '';
      let day = 1;
      try {
        const state = JSON.parse(localStorage.getItem('slf.wantReturnQuest.v1') || '{}');
        day = Math.min(7, Math.max(1, Number(state.currentDay || 1)));
      } catch (_) {}
      location.replace(`./day/${day}/${query}`);
    })();
  </script>
</head>
<body><p>Want to Return Questを開いています…</p></body>
</html>
