<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Day 1｜Want to Return Quest</title>
  <meta name="description" content="Want toに戻る回路を育てる7日Quest。" />
  <link rel="stylesheet" href="../../styles.css" />
</head>
<body data-day="1">
  <main class="app-shell">
    <header class="topbar"><div class="brand">ACE · WANT TO RETURN</div><div id="dayPill" class="day-pill">DAY 1 / 7</div></header>
    <div class="progress" aria-label="7日Quest進捗"><span id="progressBar"></span></div>
    <section class="hero"><p id="kicker" class="kicker"></p><h1 id="heroTitle"></h1><p id="heroLead" class="lead"></p></section>
    <section id="contextRoot" class="context-card is-hidden" aria-label="これまでの記録"></section>
    <section id="formScreen"><form id="questForm" novalidate><div id="fieldsRoot"></div><button id="saveButton" class="primary-btn" type="submit" disabled>今日のSignalを保存する</button></form></section>
    <section id="doneScreen" class="is-hidden"><div class="done-card"><p class="kicker">GROWTH EVENT SAVED</p><h2 id="doneTitle"></h2><p id="doneText" class="muted"></p><div id="summaryRoot" class="summary-list"></div><div id="syncStatus" class="sync-status" data-status="pending">端末に保存済み。同期を準備中…</div><div class="next-door">続けることより、戻れること。次のDayも「正解」ではなくEvidenceを取りにいく。</div><button id="nextButton" class="primary-btn" type="button"></button><button id="editButton" class="secondary-btn" type="button">回答を編集する</button><button id="restartButton" class="text-btn" type="button">このDayをやり直す</button></div></section>
  </main>
  <script src="../../app.js"></script>
</body>
</html>
